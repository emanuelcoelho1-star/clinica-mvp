name: PostgreSQL preparation tests

on:
  push:
    branches:
      - migration/postgresql
  pull_request:
    branches:
      - main

jobs:
  postgres-preparation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sorrisa_test
          POSTGRES_USER: sorrisa
          POSTGRES_PASSWORD: sorrisa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorrisa -d sorrisa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://sorrisa:sorrisa_test_password@localhost:5432/sorrisa_test
      PGSSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install temporary PostgreSQL driver for integration tests
        run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Run PostgreSQL preparation unit tests
        run: npm run test:postgres-prep
      - name: Run integration tests against PostgreSQL 16
        run: node --test tests/postgres-real-integration.test.js
